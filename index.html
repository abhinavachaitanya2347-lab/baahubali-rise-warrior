<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>Kalki: Desert Run</title><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header><a class="brand" href="#"><b>K</b><span>KALKI<small>DESERT RUN</small></span></a><nav><button id="sound">🔊</button><button id="pause">Ⅱ</button></nav></header>
<section class="stage"><canvas id="game" width="960" height="540" aria-label="Endless runner game"></canvas>
<div class="hud"><div>DISTANCE<strong id="score">0</strong></div><div>BEST<strong id="best">0</strong></div><div>ENERGY<strong id="coins">0</strong></div></div>
<div id="start" class="layer"><article><small>THE FUTURE IS IN YOUR HANDS</small><h1>KALKI<br><em>DESERT RUN</em></h1><p>Race through the wasteland. Leap over ruins. Collect energy cores.</p><button id="startBtn" class="gold">START RUN　➜</button><label>JUMP: SPACE / ↑　 ·　 SLIDE: ↓</label></article></div>
<div id="paused" class="layer hide"><article><small>TIME STANDS STILL</small><h2>RUN PAUSED</h2><button id="resume" class="gold">RESUME ➜</button></article></div>
<div id="over" class="layer hide"><article><small>THE JOURNEY CONTINUES</small><h2>RUN COMPLETE</h2><p>DISTANCE <strong id="final">0</strong></p><b id="record"></b><button id="again" class="gold">RUN AGAIN ↻</button></article></div>
</section>
<div class="touch"><button id="slideBtn">↓ SLIDE</button><button id="jumpBtn" class="gold">↑ JUMP</button></div>
<footer>✦ RUN BEYOND DESTINY ✦ <span>UNOFFICIAL FAN-MADE GAME</span></footer>
</main><script src="game.js"></script></body></html>
